# ~/.tmux.conf — agent-centric tmux build
# Goal: tmux is a shell orchestrator over zsh + CLI + Neovim, not a second IDE.
# It should make project sessions, agent panes, review popups and file-open flows fast.
# Base preserved from your config: Nord visuals, SessionX, copy/jump tools, tmux-open-nvim.

# -----------------------------------------------------------------------------
# CORE TERMINAL / SERVER SETTINGS
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',kitty:RGB'
set -ga terminal-overrides ',xterm-kitty:Tc'

set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g history-limit 200000
set -g repeat-time 300
set -g display-time 3000
set -g renumber-windows on
set -g detach-on-destroy off
setw -g allow-rename off
setw -g mode-keys vi
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1

# -----------------------------------------------------------------------------
# PREFIX / GENERAL UX
# -----------------------------------------------------------------------------
unbind C-Space
set -g prefix C-Space
bind-key C-Space send-prefix

# Better reload / redraw
unbind r
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind R refresh-client -S

# Keep current path when creating windows
bind c new-window -c '#{pane_current_path}'
bind C new-window -c '#{pane_current_path}'

# -----------------------------------------------------------------------------
# SMART SPLITS / NAVIGATION
# -----------------------------------------------------------------------------
unbind g
bind g display-panes

# Current layout helper from your config
bind s split-window -h -p 30 -c '#{pane_current_path}' \; split-window -v -c '#{pane_current_path}'

# Pane navigation (your custom layout preserved)
unbind d
bind -r d select-pane -L
unbind n
bind -r n select-pane -R
unbind h
bind -r h select-pane -D

# Extra ergonomic splits
unbind _
bind _ split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind \\ split-window -v -c '#{pane_current_path}'

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Quick window/session movement
bind -r Tab last-window
bind -r C-h previous-window
bind -r C-l next-window

# -----------------------------------------------------------------------------
# COPY MODE / TEXT WORKFLOW
# -----------------------------------------------------------------------------
bind Enter copy-mode
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-end-of-line-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi / command-prompt -p 'search down' 'send -X search-forward "%%%"'
bind -T copy-mode-vi ? command-prompt -p 'search up' 'send -X search-backward "%%%"'

# -----------------------------------------------------------------------------
# POPUPS / DEV UX
# -----------------------------------------------------------------------------
bind p display-popup -E -w 90% -h 90% -d '#{pane_current_path}' "$SHELL"
bind G display-popup -E -w 92% -h 92% -d '#{pane_current_path}' 'lazygit'


# ★ file/search popups — the core agent-review flow
bind f    display-popup -E -w 92% -h 40% -d '#{pane_current_path}' "zsh -ic 'ffv'"
bind C-f  display-popup -E -w 92% -h 92% -d '#{pane_current_path}' "zsh -ic 'gchangedv'"
bind /    display-popup -E -w 92% -h 92% -d '#{pane_current_path}' "zsh -ic 'rgv'"

bind v display-popup -E -w 92% -h 40% -d '#{pane_current_path}' \
  "zsh -ic 'eza -la --sort=modified --reverse --color=always --icons --no-permissions --no-user 2>/dev/null | tail -n +2 | fzf --ansi --header=\"newest files on top\" | awk \"{print \\\$NF}\" | xargs -I{} zsh -ic \"ton {}\"'"

# Fast file navigation into a running Neovim from the current project
bind f display-popup -E -w 92% -h 92% -d '#{pane_current_path}' "zsh -ic 'ffv'"
bind C-f display-popup -E -w 92% -h 92% -d '#{pane_current_path}' "zsh -ic 'gchangedv'"
bind / display-popup -E -w 92% -h 92% -d '#{pane_current_path}' "zsh -ic 'rgv'"



# -----------------------------------------------------------------------------
# NORD VISUALS
# -----------------------------------------------------------------------------
set -g status-interval 5
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 180

set -g status-style 'fg=#d8dee9,bg=#2e3440'
set -g message-style 'fg=#2e3440,bg=#88c0d0,bold'
set -g message-command-style 'fg=#2e3440,bg=#ebcb8b,bold'
set -g mode-style 'fg=#88c0d0,bg=#3b4252,bold'
set -g popup-style 'fg=#eceff4,bg=#2e3440'
set -g popup-border-style 'fg=#81a1c1,bg=#2e3440'
set -g menu-style 'fg=#d8dee9,bg=#3b4252'
set -g menu-selected-style 'fg=#2e3440,bg=#88c0d0,bold'
set -g clock-mode-colour '#88c0d0'
set -g display-panes-colour '#4c566a'
set -g display-panes-active-colour '#88c0d0'
set -g pane-border-style 'fg=#4c566a,bg=default'
set -g pane-active-border-style 'fg=#88c0d0,bg=default'

setw -g window-status-separator ' '
setw -g window-status-style 'fg=#7b88a1,bg=#2e3440'
setw -g window-status-format '#[fg=#7b88a1,bg=#2e3440] #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-current-style 'fg=#2e3440,bg=#88c0d0,bold'
setw -g window-status-current-format '#[fg=#2e3440,bg=#88c0d0,bold] #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-activity-style 'fg=#ebcb8b,bg=#2e3440,bold'
setw -g window-status-bell-style 'fg=#bf616a,bg=#2e3440,bold'

set -g status-left '#[fg=#2e3440,bg=#88c0d0,bold] #S #[fg=#88c0d0,bg=#2e3440]│#[default]'
set -g status-right '#{?window_zoomed_flag,#[fg=#ebcb8b]zoom │ ,}#{tmux_mode_indicator} #[fg=#81a1c1]#{pane_current_command} #[fg=#4c566a]│ #[fg=#81a1c1]%Y-%m-%d #[fg=#88c0d0]%H:%M '

# -----------------------------------------------------------------------------
# TPM PLUGINS
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'nordtheme/tmux'

# Core
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Discoverability / modal / navigation
set -g @tmux-which-key-xdg-enable 1
set -g @tmux-which-key-xdg-plugin-path '.config/tmux/plugins/tmux-which-key'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @plugin 'whame/tmux-modal'
set -g @modal-always-sticky on
set -g @modal-show-cmd-keys on
set -g @modal-cmd-icon " 🟢"
set -g status-right '#{?window_zoomed_flag,#[fg=#ebcb8b]zoom │ ,}#{?#{==:#{client_key_table},ktm-cmd},#[fg=#a3be8c]🟢 MODAL ,}#{tmux_mode_indicator} #[fg=#81a1c1]#{pane_current_command} #[fg=#4c566a]│ #[fg=#81a1c1]%Y-%m-%d #[fg=#88c0d0]%H:%M '
set -g status-right '#{?window_zoomed_flag,#[fg=#ebcb8b]zoom │ ,}#{?#{m:#{client_key_table},ktm-*},#[fg=#a3be8c]🟢 #{client_key_table} ,}#{tmux_mode_indicator} #[fg=#81a1c1]#{pane_current_command} #[fg=#4c566a]│ #[fg=#81a1c1]%Y-%m-%d #[fg=#88c0d0]%H:%M '

set -g @plugin 'schasse/tmux-jump'

# Session / persistence
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# Copy / search / extraction
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'jaclu/tmux-menus'

# Terminal / Neovim workflow
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'trevarj/tmux-open-nvim'
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'Peter-McKinney/tmux-fzf-open-files-nvim'

# -----------------------------------------------------------------------------
# PLUGIN CONFIG
# -----------------------------------------------------------------------------
# SessionX — session launcher / project switcher
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-mode 'off'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '45%'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '80%'
set -g @sessionx-filter-current 'false'
set -g @sessionx-git-branch 'on'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-ls-command 'eza --icons --color=always --group-directories-first'

# resurrect / continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# suspend — no function-key hotkeys
set -g @suspend_key 'M-z'

# mode indicator — subtle Nord-friendly labels
set -g @mode_indicator_prefix_prompt ' PREFIX '
set -g @mode_indicator_prefix_mode_style 'fg=#2e3440,bg=#a3be8c,bold'
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_copy_mode_style 'fg=#2e3440,bg=#88c0d0,bold'
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_sync_mode_style 'fg=#2e3440,bg=#ebcb8b,bold'

# tmux-thumbs — moved away from prefix+Space to free it for which-key
set -g @thumbs-key ';'
set -g @thumbs-reverse enabled
set -g @thumbs-unique enabled
set -g @thumbs-position right
set -g @thumbs-bg-color '#2e3440'
set -g @thumbs-fg-color '#d8dee9'
set -g @thumbs-hint-bg-color '#88c0d0'
set -g @thumbs-hint-fg-color '#2e3440'
set -g @thumbs-select-bg-color '#a3be8c'
set -g @thumbs-select-fg-color '#2e3440'

# extrakto — fuzzy copy / insert / open from pane history
set -g @extrakto_key 'x'
set -g @extrakto_grab_area 'window recent'
set -g @extrakto_filter_order 'path url line word all'
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_popup_size '80%,80%'
set -g @extrakto_popup_position 'C'
set -g @extrakto_clip_tool 'auto'

# tmux-jump — easymotion-like jumping
set -g @jump-key 'j'

# neolazygit — dedicated key, keep plain popup lazygit too
set -g @open-lazygit 'N'

# tmux-open-nvim
set -g @ton-open-strategy ':tabnew'
set -g @ton-prioritize-window 'true'
set -g @fzf-open-files-nvim-search-all-windows 'on'

# fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# menus
set -g @menus_show_key_hints 'Yes'
set -g @menus_display_commands 'Yes'

set -g @plugin 'papayka/tmux-tea'

# -----------------------------------------------------------------------------
# WORKFLOW CHEATSHEET
# -----------------------------------------------------------------------------
# prefix + Space    -> tmux-which-key menu (root help / discoverability)
# prefix + o        -> SessionX (sessions/projects, zoxide-aware)
# prefix + m        -> bootstrap current session into edit / agent / run windows
# prefix + E        -> jump/create edit window
# prefix + A        -> jump/create agent window
# prefix + U        -> jump/create run window
# prefix + f        -> fuzzy file picker rooted in current repo -> open in nvim
# prefix + Ctrl-f   -> changed files picker -> open selected files in nvim
# prefix + /        -> ripgrep picker -> open match in nvim
# prefix + x        -> extrakto (fuzzy copy/insert/open from pane history)
# prefix + ;        -> tmux-thumbs (fast hint-based copy)
# prefix + j        -> tmux-jump (easymotion-like jump)
# Alt-m             -> tmux-modal
# prefix + Ctrl-s   -> save tmux state
# prefix + Ctrl-r   -> restore tmux state
# Alt-z             -> suspend/resume local tmux for nested remote tmux/ssh
# prefix + N        -> neolazygit
# prefix + G        -> popup lazygit
# prefix + p        -> popup shell
# prefix + e        -> popup yazi
# ton file:line     -> open file directly into running neovim pane

# IMPORTANT: TPM init must stay last.
run '~/.tmux/plugins/tpm/tpm'
